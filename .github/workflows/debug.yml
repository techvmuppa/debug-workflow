name: Debugging Demo

on:
    workflow_dispatch:
    push:

env:
    USER_1: 'foo-user'
    USER_2: 'bar-user'

jobs:
    debug_job:
        runs-on: ubuntu-latest
        steps:
            - name: Step1 -  Checkout Repo
              run: actions/checkout@v7
            - name: Step2 - seset user_1 as USERNAME
              run: |
                echo "USERNAME=$USER_1" >> $GITHUB_ENV
            - name: Step3 - Printing USERNAME
              run: |
                echo "Printin USERNAME env from previous name"
                echo "USERNAME == $USERNAME"
                exit 1
            - name: Step4 - printing USER_2
              run:
                echo $USER_2
        

